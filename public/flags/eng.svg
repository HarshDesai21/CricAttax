<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 36">
  <!-- St. George's Cross (England) -- simple public-domain heraldic flag,
       hand-built since ISO country-code libraries only cover "GB" (Union
       Jack), not England specifically. Replace with a licensed asset if a
       closer match is ever supplied. -->
  <rect width="60" height="36" fill="#ffffff"/>
  <rect x="24" width="12" height="36" fill="#CE1124"/>
  <rect y="12" width="60" height="12" fill="#CE1124"/>
</svg>
